<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fince — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body { margin: 0; background: #ECEAE3; }
  @keyframes fcBlink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="login/login.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "radius": 14,
  "focus": "email"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const Phone = ({ children, dark }) => (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%',
      background: dark
        ? 'radial-gradient(120% 80% at 50% 0%, #161817 0%, #0a0b0a 100%)'
        : 'radial-gradient(120% 80% at 50% 0%, #efece5 0%, #e2dfd6 100%)',
    }}>
      <IOSDevice width={390} height={844} dark={dark}>
        <div style={{ position: 'absolute', inset: 0, zIndex: 30, pointerEvents: 'none' }}>
          <IOSStatusBar dark={dark} />
        </div>
        <div style={{ position: 'absolute', top: 48, left: 0, right: 0, bottom: 0 }}>{children}</div>
        <div style={{
          position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
          width: 134, height: 5, borderRadius: 3,
          background: dark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)', zIndex: 40,
        }} />
      </IOSDevice>
    </div>
  );

  const isDark = (th) => th === 'dark';

  return (
    <DesignCanvas>
      <DCSection
        id="login"
        title="Fince ▸ Sign in"
        subtitle="Brand-green forward · Inter · email + password, Face ID, Apple / Google. Live preview reflects Tweaks.">
        <DCArtboard id="live" label={`Preview · ${t.theme}`} width={420} height={900}>
          <Phone dark={isDark(t.theme)}>
            <FinceLogin theme={t.theme} radius={t.radius} focus={t.focus} />
          </Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="variants" title="Variants" subtitle="Three brand treatments of the same screen">
        <DCArtboard id="forest" label="Forest — branded hero" width={420} height={900}>
          <Phone dark={false}><FinceLogin theme="forest" radius={14} focus="password" /></Phone>
        </DCArtboard>
        <DCArtboard id="light" label="Light — cream, centered" width={420} height={900}>
          <Phone dark={false}><FinceLogin theme="light" radius={14} focus="email" /></Phone>
        </DCArtboard>
        <DCArtboard id="dark" label="Dark" width={420} height={900}>
          <Phone dark={true}><FinceLogin theme="dark" radius={14} focus="email" /></Phone>
        </DCArtboard>
      </DCSection>

      <TweaksPanel>
        <TweakSection label="Brand treatment" />
        <TweakRadio label="Theme" value={t.theme}
          options={['forest', 'light', 'dark']}
          onChange={(v) => setTweak('theme', v)} />
        <TweakSection label="Form" />
        <TweakSlider label="Corner radius" value={t.radius} min={8} max={22} step={1} unit="px"
          onChange={(v) => setTweak('radius', v)} />
        <TweakRadio label="Focused field" value={t.focus}
          options={['email', 'password']}
          onChange={(v) => setTweak('focus', v)} />
      </TweaksPanel>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
